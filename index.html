<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- EDIT THIS: the words shown on the browser tab -->
  <title>My First Build</title>

  <style>
    /* =====================================================================
       COLORS — change these three lines to restyle your whole page.
       Any hex color works. Grab one from https://coolors.co if you like.
    ===================================================================== */
    :root {
      --background: #0f1220;   /* the page background        */
      --text:       #f4f5fb;   /* your text                  */
      --accent:     #7c9cff;   /* your one highlight color   */
    }

    /* You usually won't need to change anything below this line. */
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      text-align: center;
      background: var(--background);
      color: var(--text);
      line-height: 1.6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    main { max-width: 560px; }

    .mark {
      width: 44px;
      height: 44px;
      margin: 0 auto 28px;
      border-radius: 50%;
      background: var(--accent);
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 6vw, 3.25rem);
      line-height: 1.1;
      letter-spacing: -0.01em;
    }

    p {
      margin: 0 0 20px;
      font-size: 1.15rem;
      opacity: 0.85;      /* uses your --text color, a little softer */
    }

    a {
      color: var(--accent);
      font-weight: 600;
      text-decoration: none;
      border-bottom: 2px solid transparent;
    }
    a:hover { border-bottom-color: var(--accent); }

    footer {
      margin-top: 40px;
      font-size: 0.8rem;
      opacity: 0.5;
    }
  </style>
</head>

<body>
  <main>
    <div class="mark"></div>

    <!-- EDIT THIS LINE — put your name here -->
    <h1>Your Name Here</h1>

    <!-- EDIT THIS LINE — one sentence about your project -->
    <p>One sentence about your project.</p>

    <!-- Want to add a link? Un-comment the next line and edit it. -->
    <!-- <p><a href="https://example.com">Something of mine &rarr;</a></p> -->

    <footer>Built with the Build With AI starter template.</footer>
  </main>
</body>
</html>
